# 新手导读：这是需要放进 Nginx server 配置块中的云同步反向代理片段。
#
# 用户访问公网的 /opentavern-sync，Nginx 再把请求转给同一台服务器上 127.0.0.1:8787
# 的 Python 同步服务。这样 Python 服务不必直接暴露到互联网，HTTPS 和域名由 Nginx 处理。
# client_max_body_size 要略大于后端的 10 MiB 快照限制；proxy_set_header 把原始访问者和
# 协议信息传给后端；三个 timeout 控制连接、发送和等待响应的最长时间。
#
# 这是配置片段，不应单独作为完整 nginx.conf 使用。修改后要先执行 nginx -t 检查语法，
# 再重新加载 Nginx，避免配置错误导致整个网站无法访问。
location /opentavern-sync {
    client_max_body_size 12m;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
