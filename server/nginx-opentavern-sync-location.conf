# 新手导读：这是需要放进 Nginx server 配置块中的云同步反向代理片段。
#
# 用户访问公网的 /opentavern-sync，Nginx 再把请求转给同一台服务器上 127.0.0.1:8787
# 的 Python 同步服务。这样 Python 服务不必直接暴露到互联网，HTTPS 和域名由 Nginx 处理。
# 两个同步入口不限制整份 v1 快照总量；v2 仅在应用层校验每个固定小分块。
# proxy_set_header 把原始访问者和协议信息传给后端；三个 timeout 控制连接、发送和等待响应的最长时间。
#
# 图片生成 location 使用 opentavern_image_generate_per_ip 限流 zone。必须先在 Nginx 的 http 块中
# include nginx-opentavern-rate-limit-http.conf，再在 server 块中 include 本文件。
#
# 这是配置片段，不应单独作为完整 nginx.conf 使用。修改后要先执行 nginx -t 检查语法，
# 再重新加载 Nginx，避免配置错误导致整个网站无法访问。
location /opentavern-sync {
    client_max_body_size 0;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# 前端同源部署默认使用 /api/sync；查询参数中的 v=2/op 会原样转发给后端。
location = /api/sync {
    client_max_body_size 0;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Qwen-Image 同步生成最长可能接近 180 秒，因此图片 API 使用更长的上游等待时间。
location = /api/image/generate {
    limit_req zone=opentavern_image_generate_per_ip burst=2 nodelay;
    limit_req_status 429;
    client_max_body_size 16m;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 300s;
}

# /api/image/assets/ 返回已持久化的公开图片；资源 ID 随机且不可猜，并由后端设置长期缓存头。
location ^~ /api/image/ {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 300s;
}

# 兼容不使用 /api 前缀的 OpenTavern 图片生成地址。
location = /opentavern-image/generate {
    limit_req zone=opentavern_image_generate_per_ip burst=2 nodelay;
    limit_req_status 429;
    client_max_body_size 16m;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 300s;
}

# 兼容生图入口返回的持久化图片地址。
location ^~ /opentavern-image/assets/ {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 300s;
}
