# Include only inside the OpenTavern Nginx server block.
# Mutable update pointers must be revalidated; content-addressed snapshots stay immutable.
location = /offline-manifest.json {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
}

location = /opentavern-sw.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
}

location ^~ /assets/offline/ {
    add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
    try_files $uri =404;
}
