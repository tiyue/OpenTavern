# 安装到 /etc/tmpfiles.d/opentavern-sync.conf 后执行：
# systemd-tmpfiles --create /etc/tmpfiles.d/opentavern-sync.conf
d /var/lib/opentavern-sync 0750 opentavern opentavern -
d /var/lib/opentavern-sync/images 0750 opentavern opentavern -
z /var/lib/opentavern-sync/sync.sqlite3 0640 opentavern opentavern -
z /var/lib/opentavern-sync/sync.sqlite3-* 0640 opentavern opentavern -
