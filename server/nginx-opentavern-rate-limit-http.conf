# 图片生成按客户端 IP 限速。此文件只能 include 在 Nginx 的 http 块中。
#
# include 顺序：
# 1. 在 http 块中先 include 本文件，声明 opentavern_image_generate_per_ip zone。
# 2. 再在对应的 server 块中 include nginx-opentavern-sync-location.conf。
#
# 示例：
# http {
#     include /etc/nginx/snippets/nginx-opentavern-rate-limit-http.conf;
#     server {
#         include /etc/nginx/snippets/nginx-opentavern-sync-location.conf;
#     }
# }
#
# 每个 IP 平均每分钟允许 2 个生成请求；location 中允许最多 2 个突发请求并立即返回，
# 超出速率与突发容量时返回 HTTP 429。共享内存 10 MiB 可容纳大量客户端状态。
limit_req_zone $binary_remote_addr zone=opentavern_image_generate_per_ip:10m rate=2r/m;
