# 可选的现代 systemd 加固 drop-in。
#
# 基础 opentavern-sync.service 兼容生产机使用的 systemd 219。仅当目标机器的
# `systemctl --version` 为 245 或更高时，才把本文件安装为：
# /etc/systemd/system/opentavern-sync.service.d/modern-hardening.conf
[Service]
ProtectSystem=strict
ReadWritePaths=/var/lib/opentavern-sync
StateDirectory=opentavern-sync
StateDirectoryMode=0750
ProtectClock=true
ProtectControlGroups=true
ProtectHostname=true
ProtectKernelLogs=true
ProtectKernelModules=true
ProtectKernelTunables=true
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
MemoryDenyWriteExecute=true
AmbientCapabilities=
