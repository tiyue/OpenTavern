
<!-- ===== Packy GPT Image Generation Panel ===== -->
<div id="imageGenerationPanel" class="modal-overlay fixed inset-0 z-[170] flex items-end sm:items-center justify-center hidden" role="dialog" aria-modal="true" aria-labelledby="imageGenerationTitle" aria-hidden="true">
    <div id="imageGenerationBackdrop" class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>
    <div class="relative glass w-full sm:w-[92%] sm:max-w-lg rounded-t-3xl sm:rounded-3xl p-5 sm:p-6 shadow-2xl animate-fade-in max-h-[88vh] overflow-y-auto">
        <div class="flex items-center justify-between gap-3 mb-4">
            <div>
                <h2 id="imageGenerationTitle" class="text-base font-bold text-zinc-100">生成图片</h2>
                <p class="text-[10px] text-zinc-500 mt-0.5">自动总结最近一次主回复正文，并结合对应角色卡图片进行图文生成。</p>
            </div>
            <button id="imageGenerationCloseBtn" type="button" class="w-8 h-8 rounded-full glass flex items-center justify-center text-zinc-400 hover:text-zinc-200 transition-colors" aria-label="关闭">&times;</button>
        </div>
        <div class="space-y-4">
            <div>
                <label class="text-xs font-semibold text-zinc-400">补充画面要求（可选）</label>
                <textarea id="imageGenerationPrompt" rows="4" maxlength="2000" class="w-full mt-1.5 px-3 py-2.5 glass rounded-xl text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-amber-500/30 resize-y" placeholder="正文固定取最近一次主回复；这里只填写可选的镜头、构图或氛围要求"></textarea>
            </div>
            <div>
                <div>
                    <label class="text-xs font-semibold text-zinc-400">画面比例</label>
                    <select id="imageGenerationPanelSize" class="w-full mt-1.5 px-3 py-2.5 glass rounded-xl text-sm text-zinc-200 focus:outline-none focus:ring-2 focus:ring-amber-500/30">
                        <optgroup label="Packy 标准尺寸">
                            <option value="1024x1024">1:1 · 1024 × 1024</option>
                            <option value="1536x1024">3:2 · 1536 × 1024</option>
                            <option value="1024x1536">2:3 · 1024 × 1536</option>
                        </optgroup>
                        <optgroup label="兼容高分辨率尺寸">
                            <option value="2048*2048">1:1 · 2048 × 2048</option>
                            <option value="2688*1536">16:9 · 2688 × 1536</option>
                            <option value="1536*2688">9:16 · 1536 × 2688</option>
                            <option value="2368*1728">4:3 · 2368 × 1728</option>
                            <option value="1728*2368">3:4 · 1728 × 2368</option>
                        </optgroup>
                    </select>
                </div>
            </div>
            <div id="imageGenerationStatus" class="min-h-[18px] text-xs text-zinc-500" aria-live="polite"></div>
            <div class="flex justify-end gap-2">
                <button id="imageGenerationCancelBtn" type="button" class="px-4 py-2 text-sm rounded-xl glass text-zinc-300 hover:text-zinc-100 transition-colors">取消</button>
                <button id="imageGenerationSubmitBtn" type="button" class="px-4 py-2 text-sm rounded-xl bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-white font-semibold transition-colors disabled:opacity-40 disabled:cursor-not-allowed">生成图片</button>
            </div>
        </div>
    </div>
</div>
