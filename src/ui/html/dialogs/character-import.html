
<!-- ===== Character Import Modal ===== -->
<div id="importModal" class="modal-overlay fixed inset-0 z-[100] flex items-center justify-center hidden">
    <div class="absolute inset-0 bg-black/65 backdrop-blur-sm" id="importBackdrop"></div>
    <div class="relative glass rounded-3xl w-[92%] max-w-md p-7 shadow-2xl animate-fade-in">
        <div class="flex items-center justify-between mb-5">
            <h2 class="text-lg font-bold text-zinc-100" data-i18n="import_title">Import Character Card</h2>
            <button id="importCloseBtn" class="w-8 h-8 rounded-full glass flex items-center justify-center text-zinc-400 hover:text-zinc-200 transition-colors">&times;</button>
        </div>
        <p class="text-sm text-zinc-400 mb-4"><span data-i18n="import_desc">Supports SillyTavern</span> <code class="text-amber-400 bg-amber-500/10 px-1.5 py-0.5 rounded">chara_card_v1 / v2 / v3</code> <span data-i18n="import_desc2">format JSON and PNG (embedded data) files.</span></p>
        <label class="flex flex-col items-center gap-3 p-8 glass rounded-2xl border-dashed border-2 border-white/10 hover:border-amber-500/30 cursor-pointer transition-all">
            <span class="text-xs font-semibold uppercase tracking-wider text-zinc-500">Prompt</span>
            <span class="text-sm text-zinc-400" data-i18n="import_click_hint">Click to select a .json or .png (SillyTavern) character card</span>
            <input type="file" id="importFileInput" accept=".json,.png" class="hidden">
        </label>
        <p id="importStatus" class="text-xs text-zinc-500 mt-3 text-center hidden"></p>
    </div>
</div>
