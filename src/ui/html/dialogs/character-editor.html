
<!-- ===== Character Editor Modal ===== -->
<div id="charEditorModal" class="modal-overlay fixed inset-0 z-[100] flex items-center justify-center hidden">
    <div class="absolute inset-0 bg-black/65 backdrop-blur-sm" id="charEditorBackdrop"></div>
    <div class="relative glass rounded-3xl w-[92%] max-w-2xl p-7 shadow-2xl animate-fade-in max-h-[90vh] flex flex-col">
        <div class="flex items-center justify-between mb-5 flex-shrink-0">
            <h2 class="text-lg font-bold text-zinc-100" data-i18n="char_editor_title">Edit Character Card</h2>
            <button id="charEditorCloseBtn" class="w-8 h-8 rounded-full glass flex items-center justify-center text-zinc-400 hover:text-zinc-200 transition-colors">&times;</button>
        </div>
        <div class="flex-1 overflow-y-auto space-y-4 pr-1">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] font-semibold text-zinc-400 uppercase tracking-wider" data-i18n="char_editor_name">Name</label>
                    <input id="charEditName" type="text" class="w-full mt-1 px-3 py-2 glass rounded-xl text-sm text-zinc-200 focus:outline-none focus:ring-2 focus:ring-amber-500/30 transition-all">
                </div>
                <div>
                    <label class="text-[10px] font-semibold text-zinc-400 uppercase tracking-wider" data-i18n="char_editor_tags">Tags (comma separated)</label>
                    <input id="charEditTags" type="text" class="w-full mt-1 px-3 py-2 glass rounded-xl text-sm text-zinc-200 focus:outline-none focus:ring-2 focus:ring-amber-500/30 transition-all" placeholder="tag1, tag2, tag3">
                </div>
            </div>
            <div>
                <label class="text-[10px] font-semibold text-zinc-400 uppercase tracking-wider" data-i18n="char_editor_description">Description</label>
                <textarea id="charEditDescription" rows="6" class="w-full mt-1 px-3 py-2 glass rounded-xl text-sm text-zinc-200 focus:outline-none focus:ring-2 focus:ring-amber-500/30 transition-all resize-none"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] font-semibold text-zinc-400 uppercase tracking-wider" data-i18n="char_editor_personality">Personality</label>
                    <textarea id="charEditPersonality" rows="3" class="w-full mt-1 px-3 py-2 glass rounded-xl text-sm text-zinc-200 focus:outline-none focus:ring-2 focus:ring-amber-500/30 transition-all resize-none"></textarea>
                </div>
                <div>
                    <label class="text-[10px] font-semibold text-zinc-400 uppercase tracking-wider" data-i18n="char_editor_scenario">Scenario</label>
                    <textarea id="charEditScenario" rows="3" class="w-full mt-1 px-3 py-2 glass rounded-xl text-sm text-zinc-200 focus:outline-none focus:ring-2 focus:ring-amber-500/30 transition-all resize-none"></textarea>
                </div>
            </div>
            <div>
                <label class="text-[10px] font-semibold text-zinc-400 uppercase tracking-wider" data-i18n="char_editor_first_mes">First Message</label>
                <textarea id="charEditFirstMes" rows="4" class="w-full mt-1 px-3 py-2 glass rounded-xl text-sm text-zinc-200 focus:outline-none focus:ring-2 focus:ring-amber-500/30 transition-all resize-none"></textarea>
            </div>
            <div>
                <label class="text-[10px] font-semibold text-zinc-400 uppercase tracking-wider" data-i18n="char_editor_mes_example">Example Messages</label>
                <textarea id="charEditMesExample" rows="4" class="w-full mt-1 px-3 py-2 glass rounded-xl text-sm text-zinc-200 focus:outline-none focus:ring-2 focus:ring-amber-500/30 transition-all resize-none"></textarea>
            </div>
            <div>
                <label class="text-[10px] font-semibold text-zinc-400 uppercase tracking-wider" data-i18n="char_editor_system_prompt">System Prompt</label>
                <textarea id="charEditSystemPrompt" rows="2" class="w-full mt-1 px-3 py-2 glass rounded-xl text-sm text-zinc-200 focus:outline-none focus:ring-2 focus:ring-amber-500/30 transition-all resize-none"></textarea>
            </div>
            <div>
                <label class="text-[10px] font-semibold text-zinc-400 uppercase tracking-wider" data-i18n="char_editor_post_history">Post-History Instructions</label>
                <textarea id="charEditPostHistory" rows="2" class="w-full mt-1 px-3 py-2 glass rounded-xl text-sm text-zinc-200 focus:outline-none focus:ring-2 focus:ring-amber-500/30 transition-all resize-none"></textarea>
            </div>
            <div>
                <label class="text-[10px] font-semibold text-zinc-400 uppercase tracking-wider" data-i18n="char_editor_creator_notes">Creator Notes</label>
                <textarea id="charEditCreatorNotes" rows="2" class="w-full mt-1 px-3 py-2 glass rounded-xl text-sm text-zinc-200 focus:outline-none focus:ring-2 focus:ring-amber-500/30 transition-all resize-none"></textarea>
            </div>
            <div id="charRegexControls" class="hidden border-t border-white/10 pt-4 space-y-3">
                <div>
                    <div class="text-xs font-semibold text-zinc-200" data-i18n="char_editor_regex_title">角色卡正则格式化</div>
                    <p id="charRegexSummary" class="text-[10px] leading-relaxed text-zinc-500 mt-1"></p>
                </div>
                <label class="flex items-start gap-3 cursor-pointer">
                    <input id="charEditRegexEnabled" type="checkbox" class="mt-0.5 rounded border-white/20 bg-white/5 text-amber-500 focus:ring-amber-500/30">
                    <span class="text-xs text-zinc-300" data-i18n="char_editor_regex_display">允许正则修改聊天显示文本</span>
                </label>
                <label class="flex items-start gap-3 cursor-pointer">
                    <input id="charEditRegexPromptEnabled" type="checkbox" class="mt-0.5 rounded border-white/20 bg-white/5 text-amber-500 focus:ring-amber-500/30">
                    <span class="text-xs text-zinc-300" data-i18n="char_editor_regex_prompt">允许正则修改发送给模型的提示词</span>
                </label>
            </div>
        </div>
        <div class="flex gap-3 mt-5 flex-shrink-0">
            <button id="charEditorCancelBtn" class="flex-1 px-4 py-2.5 rounded-xl text-sm font-semibold bg-white/10 hover:bg-white/15 text-zinc-300 transition-all" data-i18n="char_editor_cancel">Cancel</button>
            <button id="charEditorSaveBtn" class="flex-1 px-4 py-2.5 rounded-xl text-sm font-semibold bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-white shadow-lg shadow-amber-500/20 transition-all" data-i18n="char_editor_save">Save</button>
        </div>
    </div>
</div>
