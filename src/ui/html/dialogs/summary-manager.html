
<!-- ===== 统一总结管理器 Modal（替换原 summarizeModal + summaryHistoryModal）===== -->
<div id="summaryManagerModal" class="modal-overlay fixed inset-0 z-[100] flex items-center justify-center hidden">
    <div class="absolute inset-0 bg-black/65 backdrop-blur-sm" id="summaryManagerBackdrop"></div>
    <div class="relative glass rounded-3xl w-[94%] max-w-3xl p-0 shadow-2xl animate-fade-in flex flex-col" style="max-height: 82vh;">
        <!-- Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-white/10 flex-shrink-0">
            <h2 class="text-lg font-bold text-zinc-100" data-i18n="summary_manager_title">总结管理器</h2>
            <button id="summaryManagerCloseBtn" class="w-8 h-8 rounded-full glass flex items-center justify-center text-zinc-400 hover:text-zinc-200 transition-colors text-xl leading-none">&times;</button>
        </div>

        <div class="flex-1 flex overflow-hidden">
            <!-- 左侧：历史总结列表 -->
            <div class="w-5/12 border-r border-white/10 flex flex-col p-4 overflow-y-auto">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-xs font-semibold text-zinc-400 uppercase tracking-wider" data-i18n="summary_history_section">历史总结</span>
                </div>
                <div id="summaryManagerList" class="flex-1 space-y-3 pr-1 overflow-y-auto text-sm"></div>
            </div>

            <!-- 右侧：新建总结 -->
            <div class="w-7/12 p-5 flex flex-col">
                <span class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-3" data-i18n="summary_new_section">新建总结</span>

                <!-- 模式切换 Tab -->
                <div class="flex rounded-xl glass p-1 mb-4 w-fit">
                    <button id="modeRecentBtn" class="px-4 py-1.5 text-sm rounded-lg font-medium transition-all bg-white/10 text-zinc-100" data-i18n="summary_mode_recent">最近 N 轮</button>
                    <button id="modeRangeBtn" class="px-4 py-1.5 text-sm rounded-lg font-medium transition-all text-zinc-400 hover:text-zinc-200" data-i18n="summary_mode_custom">自定义范围</button>
                </div>

                <!-- 最近 N 轮模式 -->
                <div id="modeRecentPanel">
                    <div class="flex items-center gap-3 mb-3">
                        <span class="text-sm text-zinc-400" data-i18n="summary_manual_desc">总结最近的</span>
                        <input id="summaryRecentTurns" type="number" min="2" max="60" value="8" class="w-16 px-2.5 py-1.5 glass rounded-lg text-sm text-zinc-200 text-center focus:outline-none focus:ring-2 focus:ring-amber-500/30">
                        <span class="text-sm text-zinc-400" data-i18n="summary_manual_turns">轮对话</span>
                    </div>
                </div>

                <!-- 自定义范围模式 -->
                <div id="modeRangePanel" class="hidden">
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div>
                            <label class="block text-xs text-zinc-400 mb-1" data-i18n="summary_range_start">起始消息序号（1-based）</label>
                            <input id="rangeStart" type="number" min="1" value="1" class="w-full px-3 py-1.5 glass rounded-lg text-sm text-zinc-200">
                        </div>
                        <div>
                            <label class="block text-xs text-zinc-400 mb-1" data-i18n="summary_range_end">结束消息序号</label>
                            <input id="rangeEnd" type="number" min="2" value="12" class="w-full px-3 py-1.5 glass rounded-lg text-sm text-zinc-200">
                        </div>
                    </div>
                    <button id="previewRangeBtn" class="px-3 py-1 text-xs rounded-lg glass hover:bg-white/10 text-amber-300 transition-all" data-i18n="summary_preview_btn">预览将总结的内容范围</button>
                    <div id="rangePreview" class="mt-2 text-xs text-zinc-400 bg-black/30 rounded-xl p-2 min-h-[42px] leading-relaxed"></div>
                </div>

                <div class="flex-1"></div>

                <button id="summaryGenerateBtn" 
                        class="mt-4 w-full px-4 py-2.5 rounded-xl text-sm font-semibold bg-amber-500 hover:bg-amber-400 text-white shadow-lg shadow-amber-500/20 transition-all active:scale-[0.985]"
                        data-i18n="summary_generate">生成总结</button>
                <p id="summaryManagerStatus" class="text-xs text-zinc-500 mt-2 h-4"></p>
            </div>
        </div>
    </div>
</div>
