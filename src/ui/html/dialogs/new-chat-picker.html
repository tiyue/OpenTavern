
<!-- ===== New Chat Character Picker Modal (Phase 4 UX) ===== -->
<div id="newChatPickerModal" class="modal-overlay fixed inset-0 z-[150] flex items-center justify-center hidden">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-md" id="newChatPickerBackdrop"></div>
    <div class="relative glass rounded-3xl w-[92%] max-w-lg p-6 shadow-2xl animate-fade-in max-h-[85vh] flex flex-col">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold" data-i18n="new_chat_picker_title">选择角色卡开始新对话</h2>
            <button id="newChatPickerCloseBtn" class="w-8 h-8 rounded-full glass flex items-center justify-center text-xl leading-none">&times;</button>
        </div>

        <div id="newChatPickerList" class="grid grid-cols-2 sm:grid-cols-3 gap-3 flex-1 overflow-y-auto pr-1 custom-scroll">
            <!-- Populated dynamically by JS -->
        </div>

        <!-- 群组聊天多选提示栏（Stage 1 MVP） -->
        <div id="newChatPickerMultiBar" class="mt-3 hidden px-1 text-xs text-amber-300 flex items-center justify-between">
            <span id="newChatPickerMultiHint" data-i18n="new_chat_multi_hint">多选模式：点击角色进行选择</span>
            <span id="newChatPickerMultiCount" class="font-semibold"></span>
        </div>

        <div class="mt-4 pt-4 border-t border-white/10 flex flex-col gap-2">
            <button id="newChatNoCharacterBtn"
                    class="w-full px-4 py-2.5 rounded-xl text-sm font-semibold bg-white/10 hover:bg-white/15 transition-all">
                <span data-i18n="new_chat_no_character">不使用角色卡（空白对话）</span>
            </button>

            <button id="newChatImportCharacterBtn"
                    class="w-full px-4 py-2.5 rounded-xl text-sm font-semibold bg-white/5 hover:bg-white/10 border border-white/10 transition-all">
                <span data-i18n="new_chat_import_character">导入新角色卡</span>
            </button>
        </div>
    </div>
</div>
