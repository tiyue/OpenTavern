<!DOCTYPE html>
<!--
  新手导读：这是浏览器最先打开的单页应用入口。

  HTML 决定页面上“有什么”：设置弹窗、侧边栏、聊天区、按钮和输入框都在这里声明；
  assets/css/app.css 决定它们的外观；assets/js/app.js 负责读取数据、响应点击并调用模型。
  id 是 JavaScript 查找元素的稳定名字，class 主要用于 Tailwind/CSS 样式。

  修改元素 id 时必须同步搜索 src/app 中的引用，否则界面可能显示正常但按钮不再工作。
  带 data-i18n 的文本会被多语言系统替换。assets/js/app.js 是构建产物，应修改 src/app
  中的源码后运行 npm run build，而不是直接编辑 bundle。
-->
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>OpenTavern — AI Character Chat</title>
<meta name="description" content="OpenTavern is a browser-based AI character chat and character-card library.">
<meta property="og:type" content="website">
<meta property="og:title" content="OpenTavern — AI Character Chat">
<meta property="og:description" content="Chat with AI characters, manage character cards, conversations and world books in your browser.">
<meta property="og:image" content="/assets/images/opentavern-og.png">
<meta property="og:image:width" content="1731">
<meta property="og:image:height" content="909">
<meta name="twitter:card" content="summary_large_image">
<script id="ot-runtime-config" data-release="" data-snapshot="">
// 运行时资源与版本配置：由构建期的离线清单在运行时补全快照版本；基址按当前文档位置推导，
// 因此普通入口与 /.sites-public/ 预览共用同一份产物，不写死绝对发布路径。
(function () {
    var script = document.currentScript;
    var path = (window.location && window.location.pathname) || '/';
    var dir = path.slice(0, path.lastIndexOf('/') + 1) || '/';
    var release = (script && script.getAttribute('data-release')) || '';
    var pinned = (script && script.getAttribute('data-snapshot')) || '';
    var side = release ? 'assets/offline/' + release + '/' : '';
    window.__OT_RUNTIME__ = {
        releaseId: release,
        basePath: dir,
        snapshotBase: pinned || (side ? dir + side : ''),
        manifestUrl: dir + 'offline-manifest.json'
    };
})();
</script>
<link rel="stylesheet" href="assets/css/tailwind.css">
<script src="assets/js/purify.min.js"></script>
<script src="assets/js/marked.umd.js"></script>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="shimmer-enabled theme-new-light">
<script src="assets/js/theme-preload.js"></script>

<canvas id="shaderCanvas"></canvas>
<div id="vignetteOverlay"></div>
